<#include "/assets/base.html">

<div class="container">
    <div class="row">
        <div class="col-md-3">
            <#include "sidebar.html">
        </div>
        <div class="col-md-9">
            <!-- Alert Messages -->
            <#if error??>
                <div class="alert alert-danger" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    ${error}
                </div>
            </#if>
            <#if info??>
                <div class="alert alert-primary" role="alert">
                    <i class="fas fa-info-circle me-2"></i>
                    ${info}
                </div>
            </#if>

            <#include "auth/sessions.html">

            <#if ircKey??>
            <div class="card mb-4">
                <div class="card-header bg-transparent">
                    <h5 class="mb-0">
                        <i class="fas fa-terminal me-2"></i>IRC Key
                    </h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <input type="text" class="form-control font-monospace"
                               value="${ircKey}"
                               readonly onclick="this.select()">
                        <div class="form-text">Use this key to connect to taksiegra IRC on port 6667</div>
                    </div>
                </div>
            </div>
            </#if>

        </div>
    </div>
</div>

<#include "/assets/footer.html">
