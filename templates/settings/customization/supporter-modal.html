<div class="alert mb-0 alert-warning border-0 bg-warning bg-opacity-10">
    <div class="d-flex align-items-center">
        <div class="me-3">
            <i class="fas fa-lock fa-2x text-warning"></i>
        </div>
        <div class="flex-grow-1">
            <h6 class="alert-heading mb-2">
                <i class="fas fa-star me-1"></i>
                ${t["settings.sp_title"]?html}
            </h6>
            <p class="mb-2">${t["settings.sp_text"]?html?replace("{feature}", spalert?html)?replace("{supporter}", "<span class=\"supporter fw-bold\">" + t["profile.supporter"]?html + "</span>")}</p>
            <a href="/donate" class="btn btn-secondary btn-sm">
                <i class="fas fa-heart me-1"></i>
                ${t["settings.sp_become"]?html}
            </a>
        </div>
    </div>
</div>
