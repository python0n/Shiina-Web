<div class="d-flex align-items-center mx-1 mx-md-4 my-2 mt-3 mb-3">
        <h5 class="mb-0 me-3 text-muted text-uppercase fw-bold" style="font-size: 0.9rem; letter-spacing: 0.05em;">
            <i class="fas fa-trophy me-2 text-warning"></i>
            ${t["profile.first_places"]?html} <span id="firstPlacesCount">(-)</span>
            <select id="firstPlacesSort" onchange="changeFirstPlacesSort()" class="form-select form-select-sm ms-2" style="width:auto;display:inline-block;">
                <option value="desc">${t["profile.newest_first"]?html}</option>
                <option value="asc">${t["profile.oldest_first"]?html}</option>
            </select>
        </h5>
        <div class="flex-grow-1"
            style="height: 1px; background: linear-gradient(90deg, rgba(255,255,255,0.2) 0%, transparent 100%);"></div>
    </div>

<div class="row mx-1 mx-md-2">
    <div id="firstPlaces">
        <div id="firstPlaceLoader" class="d-flex align-items-center justify-content-center h-100">
            <div class="spinner-grow" role="status">
                <span class="visually-hidden">${t["common.loading"]?html}</span>
            </div>
        </div>
    </div>
    <div>
       <button onclick="loadMore()" id="firstPlacesButton" class="btn btn-primary btn-lg">${t["common.load_more"]?html}</button>
    </div>
</div>
